[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletodxf"
version = "0.1.0"
description = "LibreOffice Calc .ods aralığından kendi kendine yeten AutoCAD DXF blok tanımı üretir"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kadir Akar" }]

dependencies = [
    "odfpy>=1.4.1",   # .ods okuma — biçim bilgisiyle birlikte (ADR-001)
    "ezdxf>=1.1",     # DXF yazma
    "fonttools>=4.0", # metin genişliği ölçümü
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tabletodxf = "tabletodxf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabletodxf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
